  var SPEICHER = 'aa-vorschau-schluessel';

  var formular = document.getElementById('anmeldung');
  var feld = document.getElementById('passwort');
  var knopf = document.getElementById('knopf');
  var meldung = document.getElementById('meldung');

  function vonBase64(text) {
    var roh = atob(text);
    var bytes = new Uint8Array(roh.length);
    for (var i = 0; i < roh.length; i++) bytes[i] = roh.charCodeAt(i);
    return bytes;
  }

  function nachBase64(bytes) {
    var roh = '';
    for (var i = 0; i < bytes.length; i++) roh += String.fromCharCode(bytes[i]);
    return btoa(roh);
  }

  function speicherLesen() {
    try { return window.localStorage.getItem(SPEICHER); } catch (e) { return null; }
  }
  function speicherSchreiben(wert) {
    try { window.localStorage.setItem(SPEICHER, wert); } catch (e) { /* gesperrt: Anmeldung gilt nur für diese Seite */ }
  }
  function speicherLoeschen() {
    try { window.localStorage.removeItem(SPEICHER); } catch (e) { /* gesperrt */ }
  }

  function entschluesseln(schluessel) {
    return window.crypto.subtle.decrypt({ name: 'AES-GCM', iv: vonBase64(IV) }, schluessel, vonBase64(DATEN))
      .then(function (klar) { return new TextDecoder('utf-8').decode(klar); });
  }

  function anzeigen(html) {
    document.open();
    document.write(html);
    document.close();
  }

  function formularZeigen() {
    formular.hidden = false;
    feld.focus();
  }

  function mitGespeichertemSchluessel() {
    var gespeichert = speicherLesen();
    if (!gespeichert) return Promise.reject(new Error('kein Schlüssel'));
    return window.crypto.subtle
      .importKey('raw', vonBase64(gespeichert), { name: 'AES-GCM' }, false, ['decrypt'])
      .then(entschluesseln);
  }

  function mitPasswort(passwort) {
    var kodiert = new TextEncoder().encode(passwort);
    return window.crypto.subtle.importKey('raw', kodiert, 'PBKDF2', false, ['deriveKey'])
      .then(function (basis) {
        return window.crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: vonBase64(SALT), iterations: DURCHLAEUFE, hash: 'SHA-256' },
          basis,
          { name: 'AES-GCM', length: 256 },
          true,
          ['decrypt']
        );
      })
      .then(function (schluessel) {
        return entschluesseln(schluessel).then(function (html) {
          return window.crypto.subtle.exportKey('raw', schluessel).then(function (roh) {
            speicherSchreiben(nachBase64(new Uint8Array(roh)));
            return html;
          });
        });
      });
  }

  if (!window.crypto || !window.crypto.subtle) {
    formular.hidden = true;
    meldung.textContent = 'Dieser Browser kann die Seite nicht entschlüsseln. Bitte einen aktuellen Browser über https verwenden.';
    return;
  }

  formular.addEventListener('submit', function (ereignis) {
    ereignis.preventDefault();
    meldung.textContent = '';
    knopf.disabled = true;
    mitPasswort(feld.value).then(anzeigen, function () {
      knopf.disabled = false;
      meldung.textContent = 'Das Passwort stimmt nicht.';
      feld.focus();
      feld.select();
    });
  });

  mitGespeichertemSchluessel().then(anzeigen, function () {
    speicherLoeschen();
    formularZeigen();
  });
})();
